# Despliegue de Odoo 20 en Dokploy (Zellia · Odoo 20 · https://odoo20.zellia.io).
# Construye la imagen con el código de ESTE repositorio; la imagen oficial odoo:20.0 solo
# aporta el sistema y las librerías. El dominio NO va aquí (es una fila de Dokploy) y las
# variables ${...} salen de la pestaña Environment de Dokploy.
# La base de datos es un servicio aparte del proyecto (odoo-20-db, appName odoo20-db-f57kzr),
# con sus propios respaldos: redesplegar Odoo no la toca.
services:
  web:
    build:
      context: .
      dockerfile_inline: |
        FROM odoo:20.0
        USER root
        # Fuera el Odoo empaquetado en la imagen: solo corre el código de este repo.
        RUN rm -rf /usr/lib/python3/dist-packages/odoo
        COPY --chown=odoo:odoo . /opt/odoo
        USER odoo
        WORKDIR /opt/odoo
    image: odoo20-zellia:main
    restart: unless-stopped
    environment:
      PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWD: ${ADMIN_PASSWD}
    # El odoo.conf se genera al arrancar desde Environment: ninguna contraseña queda en el repo.
    # http_interface: Odoo 20 escucha solo en 127.0.0.1 por defecto y Traefik no llegaría.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        printf '[options]\naddons_path = /mnt/extra-addons,/opt/odoo/addons,/opt/odoo/odoo/addons\ndata_dir = /var/lib/odoo\ndb_host = odoo20-db-f57kzr\ndb_port = 5432\ndb_user = odoo\ndb_password = %s\nhttp_interface = 0.0.0.0\nproxy_mode = True\nadmin_passwd = %s\nlist_db = False\ndbfilter = ^odoo20$$\n' "$$PASSWORD" "$$ADMIN_PASSWD" > /etc/odoo/odoo.conf
        # Push a odoo-wl-addons (rama 20.0) => el servicio odoo-20-modulos copia los módulos y redespliega
        # este servicio; aquí se actualizan los módulos propios YA instalados antes de abrir el servidor.
        # Si la actualización falla, Odoo no arranca: mejor caído y visible que corriendo a medias.
        MODS=$$(ls /mnt/extra-addons 2>/dev/null | paste -sd, -)
        if [ -n "$$MODS" ]; then
          python3 /opt/odoo/odoo-bin -c /etc/odoo/odoo.conf -d odoo20 -u "$$MODS" --stop-after-init --no-http || exit 1
        fi
        exec python3 /opt/odoo/odoo-bin -c /etc/odoo/odoo.conf
    volumes:
      - odoo-web-data:/var/lib/odoo
      # Módulos propios: los deja aquí el servicio «odoo-20-modulos» de Dokploy, que se despliega
      # desde whitelabel-lat/odoo-wl-addons (rama 20.0). Odoo solo los lee.
      - odoo20-addons:/mnt/extra-addons:ro
    networks: [dokploy-network]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  dokploy-network:
    external: true

volumes:
  odoo-web-data:
  odoo20-addons:
    external: true
    name: odoo20-addons
